# NEA Precision Skin: Nginx in front of the Next.js app (reference for DevOps).
# Put in /etc/nginx/conf.d/nea.conf. Replace the certificate paths. Test: nginx -t && systemctl reload nginx
#
# What it does:
#  - HTTPS only (HTTP → HTTPS redirect), HTTP/2.
#  - Sets X-Real-IP itself, so visitors can't fake their IP (the app's rate limits rely on it).
#  - Caches public pages for 10 minutes (pages are the same for everyone; who is signed in is asked
#    separately by the browser). Never caches /api, /account or the staff page.
#  - Load-balances across several Node processes (one per CPU core).
#  - Clear the cache after each release:  rm -rf /var/cache/nginx/nea/* && systemctl reload nginx

proxy_cache_path /var/cache/nginx/nea levels=1:2 keys_zone=nea:50m max_size=2g inactive=60m use_temp_path=off;

upstream nea_app {
    # one line per Node process (see DEPLOY.md: PM2 or systemd, one per core)
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
    keepalive 64;
}

# don't cache anything private
map $uri $nea_no_cache {
    default            0;
    ~^/api/            1;
    ~^/account         1;
    ~^/staff-          1;   # the secret staff path starts with "staff-" (see ADMIN_PATH)
    ~^/indexnow\.txt   1;
}

server {
    listen 80;
    listen [::]:80;
    server_name neaprecisionskin.com www.neaprecisionskin.com;
    return 301 https://neaprecisionskin.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.neaprecisionskin.com;
    ssl_certificate     /etc/letsencrypt/live/neaprecisionskin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neaprecisionskin.com/privkey.pem;
    return 301 https://neaprecisionskin.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name neaprecisionskin.com;

    ssl_certificate     /etc/letsencrypt/live/neaprecisionskin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neaprecisionskin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 4m;          # Skin Lens photos are under 3 MB
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Next.js build files never change (their names change): serve straight from cache for a year
    location /_next/static/ {
        proxy_pass http://nea_app;
        proxy_cache nea;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nea_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;                      # set by us: can't be faked
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;                                      # Nea SI and Skin Lens can take up to ~60 s
        proxy_buffering on;

        proxy_cache nea;
        proxy_cache_bypass $nea_no_cache;
        proxy_no_cache $nea_no_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_valid 200 301 308 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
    }

    # Nea SI answers are streamed word by word: don't buffer them
    location = /api/ask {
        proxy_pass http://nea_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 70s;
    }
}
